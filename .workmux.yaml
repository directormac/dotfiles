# ==============================================================================
# Workmux Project Configuration (.workmux.yaml)
# Repository: .dotfiles
# Global settings: ~/.config/workmux/config.yaml
# ==============================================================================
#
# COMMON COMMANDS IN THIS REPO:
# ------------------------------------------------------------------------------
# 1. Start Feature / Dotfile Worktree (Session Mode - Default):
#    $ workmux add <branch>
#      Example: $ workmux add feat-waybar
#      -> Creates worktree at ~/Code/.worktrees/.dotfiles/feat-waybar
#      -> Opens tmux session "dotfiles-feat-waybar" with 4 windows:
#         [1:editor (nvim), 2:agent (agy), 3:term, 4:git (lazygit)]
#
# 2. Start Quickfix Worktree (Window Mode from main):
#    $ workmux add <branch> --mode window --base main -l quickfix
#      Example: $ workmux add fix-zsh-alias --mode window --base main -l quickfix
#      (Or using shell alias: $ wmq fix-zsh-alias)
#      -> Creates worktree branched from main as a single window inside current session
#      -> Opens focused Neovim without creating 4 windows
#
# 3. Use Custom Layouts:
#    $ workmux add <branch> -l duo      -> Split screen (nvim + agy)
#    $ workmux add <branch> -l quickfix -> Single window nvim
#
# 4. Finish & Merge:
#    $ workmux merge                    -> Rebase & merge into main
# ------------------------------------------------------------------------------

# Custom session & window prefix for this repository
window_prefix: "dotfiles-"

# Mode: session by default (creates dedicated tmux session per worktree)
mode: session

# Return to 'main' session when closing/removing this worktree session
default_session: main

# ------------------------------------------------------------------------------
# Session Windows (4 Windows per Worktree)
# ------------------------------------------------------------------------------
windows:
  # Window 1: Editor
  - 
    panes:
      - command: nvim
        focus: true

  # Window 2: AI Coding Agent
  - 
    panes:
      - command: clear

  # Window 3: Git
  - 
    panes:
      - command: lazygit
        focus: true
      - command: workmux dashboard -t worktrees
        split: horizontal
        percentage: 50

  # Window 4: Agent
  - 
    panes:
      - command: <agent>

# ------------------------------------------------------------------------------
# Project Named Layouts
# ------------------------------------------------------------------------------
layouts:
  # Quickfix: Single pane running Neovim, intended for quick tweaks
  quickfix:
    panes:
      - command: nvim
        focus: true

  # Duo: Split screen with Neovim (60%) and AI Agent (40%)
  duo:
    panes:
      - command: nvim
        focus: true
      - command: <agent>
        split: horizontal
        percentage: 40
