version = 1

[naming]
[picker]
show_icons = true
herdr_theme_inherit = true
replace_worktree_icon = true
show_last_workspace = true
show_last_workspace_path = true
workspace_sort = 'workspace'

[[tab]]
name = 'editor'
startup = 'nvim'

[[tab]]
name = 'terminal'
startup = 'clear'

[[tab]]
name = 'lazygit'
startup = 'lazygit'

[[tab]]
name = 'agent'
startup = 'agyx'

[[tab]]
name = 'omp'
startup = 'omp'

[[workspace]]
name = 'Dotfiles'
path = '~/.dotfiles'

[[workspace]]
name = 'Config'
path = '~/.dotfiles/config'

[[workspace]]
name = 'mkra.dev'
path = '~/Code/mkra.dev/mkra.dev'

[[workspace]]
name = 'Default'
path = '~/'

[[rule]]
path_glob = '~/Code/*'
tabs = ['editor', 'omp', 'lazygit', 'terminal']

[[rule]]
path_glob = '~/Code/.worktrees/*/*'
tabs = ['editor', 'terminal', 'lazygit']
