# vim:ft=kitty

# --- Fonts ---
font_family      Fira Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# --- Window & Appearance ---
hide_window_decorations  yes
window_padding_width     4
window_margin_width      0
single_window_margin_width 0
background_opacity       0.95
confirm_os_window_close  -1
enable_audio_bell        no

# --- Cursor & Shell ---
cursor_trail             3
cursor_trail_decay       0.1 0.4
cursor_trail_color       #94e2d5
cursor_text_color        #1e1e1e
shell_integration        enabled
allow_remote_control     yes
listen_on                unix:@mykitty

# --- Mouse & Selection ---
copy_on_select           clipboard
mouse_hide_wait          3.0
url_color                #f5e0dc
url_style                curly
open_url_with            default

# --- Layouts ---
enabled_layouts          splits,stack,tall,fat,grid

# --- Startup Session ---
startup_session          sessions/default.session

# --- Tab Bar Styling ---
tab_bar_edge             bottom
tab_bar_align            left
tab_bar_style            separator
tab_separator            " "
tab_powerline_style      angled
tab_activity_symbol      " ● "
active_tab_font_style    bold
inactive_tab_font_style  normal

# --- Theme: Catppuccin Mocha ---
foreground               #cdd6f4
background               #1e1e2e
selection_foreground     #1e1e2e
selection_background     #f5e0dc

cursor                   #f5e0dc
cursor_text_color        #1e1e2e

scrollbar_handle_color   #9399b2
scrollbar_track_color    #45475a

active_border_color      #b4befe
inactive_border_color    #6c7086
bell_border_color        #f9e2af

wayland_titlebar_color   system
macos_titlebar_color     system

active_tab_foreground    #11111b
active_tab_background    #cba6f7
inactive_tab_foreground  #cdd6f4
inactive_tab_background  #181825
tab_bar_background       #11111b

mark1_foreground         #1e1e2e
mark1_background         #b4befe
mark2_foreground         #1e1e2e
mark2_background         #cba6f7
mark3_foreground         #1e1e2e
mark3_background         #74c7ec

# 16 Terminal Colors
color0  #45475a
color8  #585b70
color1  #f38ba8
color9  #f38ba8
color2  #a6e3a1
color10 #a6e3a1
color3  #f9e2af
color11 #f9e2af
color4  #89b4fa
color12 #89b4fa
color5  #f5c2e7
color13 #f5c2e7
color6  #94e2d5
color14 #94e2d5
color7  #bac2de
color15 #a6adc8

# ==========================================
# Keybindings
# ==========================================
clear_all_shortcuts      no

# --- Quick Popup Terminal (Overlay inside Kitty) ---
map ctrl+shift+grave       launch --type=overlay --cwd=current
map f12                  launch --type=overlay --cwd=current

# --- Clipboard ---
map ctrl+shift+c         copy_to_clipboard
map ctrl+shift+v         paste_from_clipboard

# --- Font Sizing ---
map ctrl+equal           change_font_size all +1.0
map ctrl+plus            change_font_size all +1.0
map ctrl+minus           change_font_size all -1.0
map ctrl+zero            change_font_size all 0

# --- General & Reload ---
map ctrl+grave>r         load_config_file
map ctrl+shift+f5        load_config_file

# --- Splits & Window Management (Prefix: ctrl+grave or direct chords) ---
map ctrl+grave>backslash launch --location=vsplit --cwd=current
map ctrl+grave>minus     launch --location=hsplit --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+minus     launch --location=hsplit --cwd=current

# Navigate Splits (Vim directions & Arrows)
map ctrl+grave>h         neighboring_window left
map ctrl+grave>l         neighboring_window right
map ctrl+grave>k         neighboring_window up
map ctrl+grave>j         neighboring_window down
map alt+left             neighboring_window left
map alt+right            neighboring_window right
map alt+up               neighboring_window up
map alt+down             neighboring_window down

# Split Zoom & Equalize
map ctrl+grave>z         toggle_layout stack
map cmd+grave>z          toggle_layout stack
map ctrl+grave>equal     layout_action balance

# Window Closing
map ctrl+grave>x         close_window
map ctrl+shift+w         close_window
map ctrl+grave>n         new_os_window

# Resize Splits
map ctrl+shift+left      resize_window narrower
map ctrl+shift+right     resize_window wider
map ctrl+shift+up        resize_window taller
map ctrl+shift+down      resize_window shorter

# --- Tabs ---
map ctrl+grave>c         new_tab
map ctrl+shift+t         new_tab
map ctrl+grave>comma     move_tab_backward
map ctrl+grave>period    move_tab_forward
map ctrl+shift+q         close_tab

# Quick Tab Switching (1-9)
map ctrl+grave>1         goto_tab 1
map ctrl+grave>2         goto_tab 2
map ctrl+grave>3         goto_tab 3
map ctrl+grave>4         goto_tab 4
map ctrl+grave>5         goto_tab 5
map ctrl+grave>6         goto_tab 6
map ctrl+grave>7         goto_tab 7
map ctrl+grave>8         goto_tab 8
map ctrl+grave>9         goto_tab 9

# --- Scrolling ---
map shift+page_up        scroll_page_up
map shift+page_down      scroll_page_down
map shift+home           scroll_home
map shift+end            scroll_end
map ctrl+shift+k         scroll_line_up
map ctrl+shift+j         scroll_line_down
