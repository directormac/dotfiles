# Quake-style quick access terminal for kitty.
#
# Toggled with `kitty +kitten quick-access-terminal` (bound to SUPER+grave in
# Hyprland) and pre-started hidden at login by the compositor autostart hook.
# See: https://sw.kovidgoyal.net/kitty/kittens/quick-access-terminal/

# --- Placement ---
edge                     top
lines                    28
columns                  120
margin_top               0
margin_left              0
margin_right             0

# --- Behaviour ---
# Hide the panel as soon as it loses keyboard focus, like a quake terminal.
hide_on_focus_loss       yes
grab_keyboard            no
background_opacity       0.92

# Layer shell namespace (Wayland) / WM_CLASS (X11).
app_id                   kitty-quick-access
layer                    overlay

# --- Per-window kitty overrides ---
# The normal kitty.conf is still used for fonts, colours, and keybindings.
kitty_override font_size=13
kitty_override window_padding_width=12
kitty_override window_margin_width=0
