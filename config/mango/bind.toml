[bind.default]
# Reload config
"SUPER+r" = "reload_config"

# Applications
"SUPER+Return" = "spawn,ghostty +new-window"
"SUPER+SHIFT+Return" = "spawn,ghostty --class=com.ghostty.float"
"SUPER+e" = "spawn,nautilus --new-window"
"SUPER+o" = "spawn,zen"
"SUPER+d" = "spawn,which-key"
"CTRL+ALT+comma" = "spawn,pavucontrol"
"CTRL+ALT+m" = "spawn,ghostty --class=com.ghostty.float -e rmpc"

# DMS (DankMaterialShell) Integration
"SUPER+space" = "spawn,dms ipc call spotlight toggle"
"SUPER+v" = "spawn,dms ipc call clipboard toggle"
"SUPER+comma" = "spawn,dms ipc call settings focusOrToggle"
"SUPER+SHIFT+slash" = "spawn,dms ipc call keybinds toggle mangowm"
"SUPER+Alt+l" = "spawn,dms ipc call lock lock"
"SUPER+SHIFT+Escape" = "spawn,dms ipc powermenu toggle"
"SUPER+Escape" = "toggleoverview"

# DMS QuickCapture Screenshots
"Print" = "spawn,dms ipc call quickCapture screenshot region copy"
"CTRL+Print" = "spawn,dms ipc call quickCapture screenshot full copy"
"ALT+Print" = "spawn,dms ipc call quickCapture screenshot window copy"
"SHIFT+Print" = "spawn,dms ipc call quickCapture screenshot region edit"

# Window Management
"SUPER+SHIFT+q" = "killclient,"
"SUPER+SHIFT+space" = "togglefloating,"
"SUPER+f" = "togglemaximizescreen,"
"SUPER+SHIFT+f" = "togglefullscreen,"
"SUPER+CTRL+f" = "togglefakefullscreen,"
"SUPER+c" = "centerwin,"
"SUPER+p" = "dwindle_toggle_split_direction"
"SUPER+u" = "focuslast,"
"SUPER+g" = "toggleglobal,"
"SUPER+s" = "toggle_scratchpad"
"SUPER+SHIFT+s" = "minimized,"
"SUPER+SHIFT+i" = "restore_minimized"
"ALT+z" = "toggle_scratchpad"
"ALT+Tab" = "togglejump,"

# Switch Window Focus (Directional & Stack)
"SUPER+Tab" = "focusstack,next"
"SUPER+Left" = "focusdir,left"
"SUPER+Right" = "focusdir,right"
"SUPER+Up" = "focusdir,up"
"SUPER+Down" = "focusdir,down"
"SUPER+h" = "focusdir,left"
"SUPER+l" = "focusdir,right"
"SUPER+k" = "focusdir,up"
"SUPER+j" = "focusdir,down"

# Move Window (Re-insert / Swap)
"SUPER+SHIFT+Left" = "move_client,left"
"SUPER+SHIFT+Right" = "move_client,right"
"SUPER+SHIFT+Up" = "move_client,up"
"SUPER+SHIFT+Down" = "move_client,down"
"SUPER+SHIFT+h" = "move_client,left"
"SUPER+SHIFT+l" = "move_client,right"
"SUPER+SHIFT+k" = "move_client,up"
"SUPER+SHIFT+j" = "move_client,down"

# Swap Window (Explicit Exchange)
"SUPER+CTRL+Left" = "exchange_client,left"
"SUPER+CTRL+Right" = "exchange_client,right"
"SUPER+CTRL+Up" = "exchange_client,up"
"SUPER+CTRL+Down" = "exchange_client,down"
"SUPER+CTRL+h" = "exchange_client,left"
"SUPER+CTRL+l" = "exchange_client,right"
"SUPER+CTRL+k" = "exchange_client,up"
"SUPER+CTRL+j" = "exchange_client,down"

# Floating Window Position
"CTRL+SHIFT+Left" = "movewin,-50,+0"
"CTRL+SHIFT+Right" = "movewin,+50,+0"
"CTRL+SHIFT+Up" = "movewin,+0,-50"
"CTRL+SHIFT+Down" = "movewin,+0,+50"

# Floating Window Size
"CTRL+ALT+Left" = "resizewin,-50,+0"
"CTRL+ALT+Right" = "resizewin,+50,+0"
"CTRL+ALT+Up" = "resizewin,+0,-50"
"CTRL+ALT+Down" = "resizewin,+0,+50"

# Layout Sizing
"SUPER+equal" = "setmfact,+0.05"
"SUPER+minus" = "setmfact,-0.05"

# Scroller Layout
"ALT+e" = "set_proportion,1.0"
"ALT+x" = "switch_proportion_preset,"
"alt+super+ctrl+Left" = "scroller_stack,left"
"alt+super+ctrl+Right" = "scroller_stack,right"
"alt+super+ctrl+Up" = "scroller_stack,up"
"alt+super+ctrl+Down" = "scroller_stack,down"

# Layout Switching
"SUPER+n" = "switch_layout"
"alt+shift+Return" = "dwindle_toggle_split_direction"

# Tag Switch
"CTRL+Left" = "viewtoleft_have_client,0"
"CTRL+Right" = "viewtoright_have_client,0"

# Split Tag Bindings Across Monitors
# Monitor 1 (DP-2): Tags 1-5
"SUPER+1" = "viewcrossmon,1,DP-2"
"SUPER+2" = "viewcrossmon,2,DP-2"
"SUPER+3" = "viewcrossmon,3,DP-2"
"SUPER+4" = "viewcrossmon,4,DP-2"
"SUPER+5" = "viewcrossmon,5,DP-2"

# Monitor 2 (DP-3): Tags 6-9
"SUPER+6" = "viewcrossmon,6,DP-3"
"SUPER+7" = "viewcrossmon,7,DP-3"
"SUPER+8" = "viewcrossmon,8,DP-3"
"SUPER+9" = "viewcrossmon,9,DP-3"

# Move Window to Tag on Specific Monitor
"SUPER+SHIFT+1" = "tagcrossmon,1,DP-2"
"SUPER+SHIFT+2" = "tagcrossmon,2,DP-2"
"SUPER+SHIFT+3" = "tagcrossmon,3,DP-2"
"SUPER+SHIFT+4" = "tagcrossmon,4,DP-2"
"SUPER+SHIFT+5" = "tagcrossmon,5,DP-2"

"SUPER+SHIFT+6" = "tagcrossmon,6,DP-3"
"SUPER+SHIFT+7" = "tagcrossmon,7,DP-3"
"SUPER+SHIFT+8" = "tagcrossmon,8,DP-3"
"SUPER+SHIFT+9" = "tagcrossmon,9,DP-3"

# Monitor Navigation
"alt+shift+Left" = "focusmon,left"
"alt+shift+Right" = "focusmon,right"
"alt+shift+h" = "focusmon,left"
"alt+shift+l" = "focusmon,right"
"SUPER+Alt+Left" = "tagmon,left"
"SUPER+Alt+Right" = "tagmon,right"

# Gaps
"ALT+SHIFT+x" = "incgaps,1"
"ALT+SHIFT+z" = "incgaps,-1"
"ALT+SHIFT+r" = "togglegaps"

# Multimedia Controls (active even when locked)
[bind.default.lock]
"XF86AudioRaiseVolume" = "spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume" = "spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"XF86AudioMute" = "spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"XF86AudioMicMute" = "spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"
"XF86AudioPlay" = "spawn,playerctl play-pause"
"XF86AudioPrev" = "spawn,playerctl previous"
"XF86AudioNext" = "spawn,playerctl next"
"SUPER+XF86AudioNext" = "spawn,playerctl position +5"

# Multi-action bindings (tag + focus monitor)
[bind.default.conflict]
"SUPER+SHIFT+o" = [
  "tagmon,next",
  "focusmon,next",
]
"SUPER+SHIFT+period" = [
  "tagmon,right",
  "focusmon,right",
]
"SUPER+SHIFT+comma" = [
  "tagmon,left",
  "focusmon,left",
]

[mousebind.default]
"SUPER+btn_left" = "moveresize,curmove"
"SUPER+btn_right" = "moveresize,curresize"

[axisbind.default]
"SUPER+UP" = "viewtoleft_have_client"
"SUPER+DOWN" = "viewtoright_have_client"

[gesturebind.default]
"none+left+3" = "focusdir,left"
"none+right+3" = "focusdir,right"
"none+up+3" = "focusdir,up"
"none+down+3" = "focusdir,down"
"none+right+4" = "viewprev_have_client"
"none+left+4" = "viewnext_have_client"
"none+up+4" = "enteroverview"
"none+down+4" = "leaveoverview"
