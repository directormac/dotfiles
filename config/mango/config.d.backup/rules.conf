# Window & Layer Rules for Mango WM

# ==========================================
# Layer Rules
# ==========================================
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

# ==========================================
# Window Rules: System & Event Handling
# ==========================================
# Suppress unwanted maximize events from applications
windowrule=ignore_maximize:1,appid:.*

# Prevent empty drag/tooltip surfaces from stealing focus
windowrule=nofocus:1,appid:^$,title:^$

# ==========================================
# Window Rules: Floating Applications (50% size, centered)
# ==========================================
windowrule=isfloating:1,width:0.5,height:0.5,appid:^bitwarden$
windowrule=isfloating:1,width:0.5,height:0.5,appid:^dev.noctalia.Noctalia$
windowrule=isfloating:1,width:0.5,height:0.5,appid:^feh$
windowrule=isfloating:1,width:0.5,height:0.5,appid:^gnome-disks$
windowrule=isfloating:1,width:0.5,height:0.5,appid:^gsmartcontrol$
windowrule=isfloating:1,width:0.5,height:0.5,appid:^com\.danklinux\.dankcalendar$
windowrule=isfloating:1,width:0.5,height:0.5,appid:^galculator$
windowrule=isfloating:1,width:0.5,height:0.5,appid:^org\.pulseaudio\.pavucontrol$
windowrule=isfloating:1,width:0.5,height:0.5,appid:^pavucontrol$
windowrule=isfloating:1,width:0.5,height:0.5,appid:^org\.localsend\.localsend_app$
windowrule=isfloating:1,width:0.5,height:0.5,appid:^com\.ghostty\.float$
windowrule=isfloating:1,width:0.5,height:0.5,appid:^org\.gnome\.Nautilus$
windowrule=isfloating:1,width:0.5,height:0.5,appid:^mpv$
windowrule=isfloating:1,width:0.5,height:0.5,appid:^nm-connection-editor$
windowrule=isfloating:1,width:0.5,height:0.5,appid:^[Ww]aydroid$
windowrule=isfloating:1,width:0.5,height:0.5,appid:^com\.jaoushingan\.WaydroidHelper$
windowrule=isfloating:1,width:0.5,height:0.5,appid:^com\.neovim\.editor$
windowrule=isfloating:1,width:0.5,height:0.5,appid:^com\.superfile\.fm$

# ==========================================
# Window Rules: Waydroid Sub-applications
# ==========================================
windowrule=isfloating:1,width:0.5,height:0.5,appid:^waydroid\.com\..*

# ==========================================
# Window Rules: Virtualization
# ==========================================
windowrule=isfloating:1,width:0.5,height:0.5,appid:^virt-manager$
windowrule=isfloating:1,width:0.5,height:0.5,appid:^qemu$

# ==========================================
# Window Rules: Dialogs & Security Pickers
# ==========================================
windowrule=isfloating:1,width:0.5,height:0.5,title:^Select what to share.*$
windowrule=isfloating:1,appid:^pinentry.*$

# ==========================================
# Window Rules: Browser Extension Popups (Firefox & Zen)
# ==========================================
windowrule=isfloating:1,width:800,height:600,appid:^(firefox|zen|zen-beta.*)$,title:^Extension:.*$
