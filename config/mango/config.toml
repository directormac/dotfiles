[global]

# --- Appearance & Window Decoration ---
blur = 0
blur_layer = 0
blur_optimized = 1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0

border_radius = 1
no_radius_when_single = 0
focused_opacity = 1.0
unfocused_opacity = 1.0

dim_enable = 0

# Gaps and Window Sizing
gap_inner_horizontal = 1
gap_inner_vertical = 1
gap_outer_horizontal = 1
gap_outer_vertical = 1
scratchpad_width_ratio = 0.8
scratchpad_height_ratio = 0.9
border_px = 1

# --- Theme (Catppuccin Mocha) ---
shadows_color = 0x11111b88
dim_focused_color = 0x00000000
dim_unfocused_color = 0x11111b55

root_color = 0x11111bff
border_color = 0x313244ff
drop_color = 0xcba6f755
split_color = 0xfab387ff
focus_color = 0xcba6f7ff
maximized_screen_color = 0xa6e3a1ff
urgent_color = 0xf38ba8ff
scratchpad_color = 0x89b4faff
global_color = 0xf5c2e7ff
overlay_color = 0x94e2d5ff

jump_label_decorate_fg_color = 0xcdd6f4ff
jump_label_decorate_bg_color = 0x1e1e2eff
jump_label_decorate_focus_fg_color = 0x11111bff
jump_label_decorate_focus_bg_color = 0xcba6f7ff
jump_label_decorate_border_color = 0xcba6f7ff

group_bar_decorate_fg_color = 0xa6adc8ff
group_bar_decorate_bg_color = 0x181825ff
group_bar_decorate_focus_fg_color = 0x11111bff
group_bar_decorate_focus_bg_color = 0xcba6f7ff
group_bar_decorate_border_color = 0xcba6f7ff

# --- Animations ---
animations = 1
layer_animations = 1
animation_type_open = "slide"
animation_type_close = "slide"
animation_fade_in = 1
animation_fade_out = 1
tag_animation_direction = 1
zoom_initial_ratio = 0.4
zoom_end_ratio = 0.8
fade_in_begin_opacity = 0.5
fade_out_begin_opacity = 0.8
animation_duration_move = 500
animation_duration_open = 400
animation_duration_tag = 350
animation_duration_close = 800
animation_duration_focus = 0
animation_curve_open = [0.46, 1.0, 0.29, 1]
animation_curve_move = [0.46, 1.0, 0.29, 1]
animation_curve_tag = [0.46, 1.0, 0.29, 1]
animation_curve_close = [0.08, 0.92, 0, 1]
animation_curve_focus = [0.46, 1.0, 0.29, 1]
animation_curve_opacity_fade_out = [0.5, 0.5, 0.5, 0.5]
animation_curve_opacity_fade_in = [0.46, 1.0, 0.29, 1]

# --- Layout Defaults ---
scroller_structs = 20
scroller_default_proportion = 0.9
scroller_focus_center = 1
scroller_prefer_center = 0
edge_scroller_pointer_focus = 1
edge_scroller_focus_allow_speed = 0.0
scroller_ignore_proportion_single = 1
scroller_default_proportion_single = 1.0
scroller_proportion_preset = [0.5, 0.8, 1.0]

new_is_master = 0
default_master_factor = 0.5
default_master_count = 1
tag_num = 9
smart_gaps = 0
center_master_overspread = 0
center_when_single_stack = 0

dwindle_smart_split = 0
dwindle_drop_simple_split = 1
dwindle_manual_split = 0
dwindle_horizontal_split = 1
dwindle_vertical_split = 1
dwindle_preserve_split = 0

hotarea_size = 10
enable_hotarea = 0
hotarea_disable_on_fullscreen = 1
overview_gap_inner = 5
overview_gap_outer = 30
overcircle_center_ratio = 0.5

# --- Input Devices ---
repeat_rate = 25
repeat_delay = 600
numlock_on = 0
xkb_rules_layout = "us"

disable_trackpad = 0
tap_to_click = 1
tap_and_drag = 1
drag_lock = 1
trackpad_natural_scrolling = 0
trackpad_disable_while_typing = 1
trackpad_left_handed = 0
trackpad_middle_button_emulation = 0
swipe_min_threshold = 1

mouse_natural_scrolling = 0

# --- Miscellaneous ---
no_border_when_single = 0
axis_bind_apply_timeout = 100
focus_on_activate = 1
idle_inhibit_ignore_visible = 0
idle_inhibit_when_fullscreen = 0
sloppy_focus = 1
warp_cursor = 1
focus_cross_monitor = 1
focus_direction_only_zone_overlap = 0
exchange_cross_monitor = 1
auto_reload_config = 1
focus_cross_tag = 0
enable_floating_snap = 0
snap_distance = 30
float_full_to_top = 0
cursor_size = 24
drag_tile_to_tile = 1
drag_tile_small = 1

# Recommended XWayland Settings
xwayland_persistence = 1
xwayland_ignore_scale = 1

# Sub-configs
source = [
  "./bind.toml",
  "./rule.toml",
  "./tag.toml",
]

# Local machine overrides (Optional)
source_optional = [
  "./local.toml",
]
