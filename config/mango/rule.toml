# Window Rules: Dialogs & Security Pickers
[[rule.window_rule]]
is_floating = 1
width = 0.5
height = 0.5
title = "^Select what to share.*$"

[[rule.window_rule]]
is_floating = 1
app_id = "^pinentry.*$"

# Window Rules: Browser Extension Popups (Firefox & Zen)
[[rule.window_rule]]
is_floating = 1
width = 800
height = 600
app_id = "^(firefox|zen|zen-beta.*)$"
title = "^Extension:.*$"
