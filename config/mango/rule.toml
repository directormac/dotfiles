# Layer Rules
[[rule.layer_rule]]
animation_type_open = "zoom"
layer_name = "rofi"

[[rule.layer_rule]]
animation_type_close = "zoom"
layer_name = "rofi"

# Window Rules: System & Event Handling
[[rule.window_rule]]
ignore_maximize = 1
app_id = ".*"

[[rule.window_rule]]
no_focus = 1
app_id = "^$"
title = "^$"

# Window Rules: Floating Applications (50% size, centered)
[[rule.window_rule]]
is_floating = 1
width = 0.5
height = 0.5
app_id = "^bitwarden$"

[[rule.window_rule]]
is_floating = 1
width = 0.5
height = 0.5
app_id = "^dev.noctalia.Noctalia$"

