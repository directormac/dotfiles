#:schema https://mise.jdx.dev/schema/mise.json

# References
# [cli](https://mise.jdx.dev/cli/)
# [toml](https://toml.io/en/v1.1.0)
# [tera](https://mise.jdx.dev/templates.html#template-rendering)
# [configuration](https://mise.jdx.dev/configuration.html#configuration)

# Config files are located in `config/mise/config.d`
# This file is for some custom overrides 
# [Configuration Heirarchy](https://mise.jdx.dev/configuration.html#visual-configuration-hierarchy)
# [Tools](https://mise.jdx.dev/dev-tools/#dev-tools)
# [Versions](https://mise-versions.jdx.dev/)
# [github backend](https://mise.jdx.dev/dev-tools/backends/github.html)
# [http](https://mise.jdx.dev/dev-tools/backends/http.html)

# [settings](./conf.d/00-settings.toml)
# [bootstrap](./conf.d/01-bootstrap.toml)
# [dotfiles](./conf.d/02-dotfiles.toml)


[tool_alias]
oxlint = "github:oxc-project/oxc"
oxfmt = "github:oxc-project/oxc"
vite-plus = "github:voidzero-dev/vite-plus"
sesh = "github:joshmedeski/sesh"
neovim = "github:neovim/neovim"
ztmux = "github:MenkeTechnologies/ztmux"
tmuxpanel = "github:psmux/Tmux-Plugin-Panel"

[tools]
# Runtimes and Compilers

rust = "latest"

# OTP
elixir = "latest"
erlang = "latest"

# Javascript
node = "latest"
bun = "latest"

# JVM
java = "openjdk-17"
kotlin = "2.1.0"

# Package Managers
pnpm = "latest"
uv = "latest"
aube = "latest"

# LSP
expert = "latest"
"npm:oxlint-tsgolint" = "latest"


# Utils
usage = "latest"
jq = "latest"
pitchfork = "latest"
watchexec = "latest"


# Build tools
bazel = "latest"


"cargo:mdv" = "latest" # https://github.com/WhoSowSee/mdv

herdr = "latest"
agy = "latest"
"cargo:ytkew" = "latest"

# [tools."github:neovim/neovim"]
# prerelease = true
# asset_pattern = "nvim-linux-x86_64.tar.gz"
# bin_path = "nvim-linux-x86_64/bin/nvim"
# version = "nightly"
# rename_exe = "neovim"

[tools.neovim]
prerelease = true
asset_pattern = "nvim-linux-x86_64.tar.gz"
# bin_path = "nvim-linux-x86_64/bin/nvim"
version = "nightly"
rename_exe = "neovim"

[tools."github:psmux/Tmux-Plugin-Panel"]
# asset_pattern = "tmuxpanel-v0.1.1-linux-x64.tar.gz"
asset_pattern = "tmuxpanel-v{{ version }}-linux-x64.tar.gz"
version = "v0.1.1"


# [tools."github:graelo/tmux-backup"]
# # asset_pattern = "tmux-backup-*-x86_64-unknown-linux-musl.tar.xz"
# version = "v0.6.0"


# [tools."github:wfxr/tmup"]
# version = "v0.3.0"


[tools.ztmux]
asset_pattern = "ztmux-v{{ version }}-x86_64-unknown-linux-gnu.tar.gz"
version = "v3.7.45"


[tools.oxlint]
version = "apps_v1.79.0"
matching = "oxlint"
rename_exe = "oxlint"

[tools.oxfmt]
version = "apps_v1.79.0"
matching = "oxfmt"
rename_exe = "oxfmt"

[tools.vite-plus]
version = "v0.2.9"
matching = "vp"
rename_exe = "vp"

[tools.sesh]
version = "v2.28.0"

[tools."http:winbox"]
version = "4.3"
url = "https://download.mikrotik.com/routeros/winbox/{{ version }}/WinBox_Linux.zip"
checksum_url = "https://download.mikrotik.com/routeros/winbox/{{ version }}/WinBox_Linux.zip.sha256"


