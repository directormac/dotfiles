
[backdrop]
enabled = true

[bar.default]
background_opacity = 0.0
center = ["clock", "launcher", "audio_visualizer"]
concave_edge_corners = false
font_family = "FiraMono Nerd Font Mono"
margin_ends = 0
radius = 0
shadow = false
start = ["wallpaper", "workspaces", "active_window"]
widget_spacing = 12

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@winit", "lockscreen-login-box@Virtual-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
box_height = 196.0
box_width = 810.0
cx = 640.0
cy = 618.0
output = "Virtual-1"
placement_height = 800.0
placement_width = 1280.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[lockscreen_widgets.widget."lockscreen-login-box@winit"]
box_height = 196.0
box_width = 720.0
cx = 312.0
cy = 542.0
output = "winit"
placement_height = 724.0
placement_width = 624.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@winit".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[plugins]
enabled = ["avivbintangaringga/nix-monitor"]

[shell]
font_family = "FiraCode Nerd Font Mono"
niri_overview_type_to_launch_enabled = true
screen_time_enabled = true
settings_show_advanced = true

[shell.panel]
launcher_placement = "attached"

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Mocha Blue"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[theme.templates]
community_ids = ["zen-browser"]

[wallpaper]
directory = "~/.config/wallpapers"
fill_mode = "center"

[wallpaper.automation]
enabled = true
interval_seconds = 300
order = "random"
recursive = true

[widget.wallpaper]
enabled = false
