setupVersion: 2
modelRoles:
  plan: google-antigravity/gemini-3.8-flash:high
  default: google-antigravity/gemini-3.8-flash:high
theme:
  dark: dark-catppuccin
  light: dark-catppuccin
memory:
  backend: mnemopi
plan:
  autosave: true
  defaultOnStartup: false
statusLine:
  preset: default
  contextLine: annotated
  sessionAccent: false
  transparent: true
terminal:
  showProgress: true
branchSummary:
  enabled: true
extendedContext: true
contextPromotion:
  enabled: true
astGrep:
  enabled: true
github:
  enabled: true
worktree:
  onStart: ask
  base: ~/Code/.worktrees
speech:
  enabled: true
  mode: assistant
startup:
  checkUpdate: false
  setupWizard: false
  quiet: true
autoResume: false
doubleEscapeAction: rewind
