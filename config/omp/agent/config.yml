setupVersion: 2
modelRoles:
  plan: google-antigravity/gemini-4-argon:high
  slow: google-antigravity/claude-sonnet-5-5
  smol: google-antigravity/gemini-3.8-flash:auto
  default: google-antigravity/gemini-3.8-flash
  advisor: google-antigravity/gemini-4-argon
theme:
  dark: dark-catppuccin
  light: dark-catppuccin
memory:
  backend: mnemopi
plan:
  autosave: true
  defaultOnStartup: false
statusLine:
  preset: default
  contextLine: annotated
  sessionAccent: false
  transparent: true
terminal:
  showProgress: true
branchSummary:
  enabled: true
extendedContext: true
contextPromotion:
  enabled: true
astGrep:
  enabled: true
github:
  enabled: true
worktree:
  onStart: "off"
  base: ~/Code/.worktrees
  onExit: ask
speech:
  enabled: true
  mode: assistant
startup:
  checkUpdate: false
  setupWizard: false
  quiet: true
autoResume: false
doubleEscapeAction: rewind
retry:
  fallbackChains:
    default:
      - google-antigravity/gemini-3.8-flash
    google-antigravity/claude-sonnet-5-5:
      - google-antigravity/gemini-3.8-flash
    google-antigravity/gemini-4-argon:
      - google-antigravity/gemini-3.8-flash
read:
  renderMarkdown: true
  summarize:
    prose: true
readLineNumbers: true
lsp:
  formatOnWrite: true
edit:
  autoRepair:
    enabled: true
  mode: hashline
stt:
  enabled: true
marketplace:
  autoUpdate: auto
providers:
  tinyModelDevice: gpu
dev:
  autoqaConsent: denied
defaultThinkingLevel: auto
collab:
  autoStart: "off"
  displayName: Artifex@Super
speechgen:
  enabled: true
tui:
  vimMode: true