# Prefix key + T
bind T clock-mode

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
#Reduce time to wait for Escape key. For Neovim
set -g escape-time 0
set -g extended-keys on
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -sg escape-time 0
set -g remain-on-exit on
set -ag terminal-overrides ",*:RGB"
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"
# # Tell tmux that the *outside* terminal (Ghostty/Alacritty/etc.) supports True Color (RGB)
# # This works for Ghostty (which uses xterm-ghostty) and others using xterm-256color
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# set -ag terminal-features "xterm-kitty:extkeys"
# set -as terminal-features ",*:clipboard"
# Support for undercurls and their colors in Neovim
# set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
