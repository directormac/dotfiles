# Tmux Configuration
#
# Must not overide with neovim and terminal emulator keys
# Reference https://github.com/tmux/tmux/wiki/Modifier-Keys
unbind C-b
set -g prefix C-a


# Key bind section all key assignments below must use Prefix-key
# Prefix key is default <C-a>
#Vim style pane selection <Prefix-key>
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind \\ split-window -v -c "#{pane_current_path}" #split to current path
bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"

bind = split-window -h -c "#{pane_current_path}" #split to current path
bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"


bind -N "Kill pane" -n M-Escape kill-pane
bind -N "Kill pane" x kill-pane
bind -N "kill window" -n C-w kill-window
bind -N "Kill session" X kill-session
bind -N "Kill session" -n C-q kill-session

# bind -N "Split pane vertically" h split-window -v -c "#{pane_current_path}"
# bind -N "Split pane horizontally" v split-window -h -c "#{pane_current_path}"

bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D

bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

# bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"


bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

unbind-key -n M-0
unbind-key -n M-1
unbind-key -n M-2
unbind-key -n M-3
unbind-key -n M-4
unbind-key -n M-5
unbind-key -n M-6
unbind-key -n M-7
unbind-key -n M-8
unbind-key -n M-9

bind-key -n C-, select-window -t -1
bind-key -n C-. select-window -t +1

bind-key -T root C-1 select-window -t 1
bind-key -T root C-2 select-window -t 2
bind-key -T root C-3 select-window -t 3
bind-key -T root C-4 select-window -t 4
bind-key -T root C-5 select-window -t 5
bind-key -T root C-6 select-window -t 6
bind-key -T root C-7 select-window -t 7
bind-key -T root C-8 select-window -t 8
bind-key -T root C-9 select-window -t 9


#Reduce time to wait for Escape key. For Neovim
set -g escape-time 10
set -g extended-keys on
set -g extended-keys-format csi-u
#Enable Mouse
set -g mouse on
set -g status-position bottom
#Clipboard
set -g set-clipboard on
set -s command-alias[99] 'load-buffer=load-buffer -w'
# https://gist.github.com/andersevenrud/015e61af2fd264371032763d4ed965b6

set -g allow-passthrough on
# Inside tmux, we want it to report itself as tmux-256color
set -g default-terminal "tmux-256color"


# Tell tmux that the *outside* terminal (Ghostty/Alacritty/etc.) supports True Color (RGB)
# This works for Ghostty (which uses xterm-ghostty) and others using xterm-256color
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Support for undercurls and their colors in Neovim
# set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'


#Set base index 1
set -g base-index 1 # index of tabs starts at 1
set -g pane-base-index 1 # inex of pane must also start at 1
set-window-option -g pane-base-index 1 # Base window number?
set-option -g renumber-windows on # Renumber windows on remove
#History Limit 50k lines
set -g history-limit 100000
#Set Refresh every Second
set-option -g status-interval 1
# Disable automatic renaming
# set-option -g automatic-rename on
# set titles
# set-option -g set-titles on

set -g allow-rename off

# Set center
# set -g status-justify 'absolute-centre'
#dont exit from tmux when closing session
set -g detach-on-destroy off 


#
# Config and help
# bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"
bind -N "Reload configuration" R source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"


# # Search entire file system (ALT-`)
# bind-key -n 'M-`' run "tmux split-window -p 40 'tmux send-keys -t #{pane_id} \"$(locate / | fzf -m | paste -sd\\  -)\"'"
# set -g FZF_CTRL_T_COMMAND "command find -L \$dir -type f 2> /dev/null | sed '1d; s#^\./##'"

# https://github.com/theredspoon/tmux-persist-autosave
# https://github.com/hyoretsu/tmux-persist


# Prefix key + T
bind T clock-mode


#Plugins Install <Prefix-I> to Install
set -g @plugin 'catppuccin/tmux' 

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' #sensible commands
set -g @plugin 'tmux-plugins/tmux-resurrect' # resurrect sessions

set -g @resurrect-save 'S'
set -g @resurrect-restore 'r'

set -g @plugin 'tmux-plugins/tmux-continuum' #works with resurrreect

set -g @continuum-restore 'on'

set -g @plugin 'tmux-plugins/tmux-open' #open links and files in copy mode
set -g @plugin 'tmux-plugins/tmux-pain-control' # manage panes and windowsss

set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'alexwforsythe/tmux-which-key'

set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-open "zen-browser"
set -g @fzf-url-bind 'o'

set -g @plugin 'sainnhe/tmux-fzf'

set -g @plugin 'jimeh/tmuxifier' #tmux persistent layouts
set -g @plugin 'omerxx/tmux-floax'

# Sesh Keybinding
bind-key "t" run-shell "sesh connect \"$(
	sesh list --icons | fzf-tmux -p 80%,70% \
		--no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
		--header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux <ctrl-c>...' \
		--bind 'tab:up,btab:down' \
		--bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
		--bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
		--bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
		--bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
		--bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .git .)' \
		--bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)'
)\""


set -g @plugin 'catppuccin/tmux'

# Reference https://github.com/catppuccin/tmux/blob/main/docs/reference/configuration.md

set -g @catppuccin_flavor 'mocha' # latte,frappe, macchiato or mocha
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M:%S"
set -g @catppuccin_status_background "none"

# Mauve Overrides for a consistent look
set -g @catppuccin_window_current_number_color "#cba6f7"
set -g @catppuccin_directory_color "#cba6f7"
set -g @catppuccin_session_color "#cba6f7"

### Plugin: https://github.com/catppuccin/tmux
set-option -g @catppuccin_window_number_position 'left'
set-option -g @catppuccin_window_flags 'no'
set-option -g @catppuccin_window_text ' #W'
set-option -g @catppuccin_window_current_text ' #W'
set-option -g @catppuccin_status_middle_separator ''


run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'



set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -g @catppuccin_status_background "none"

# Resource TMUX Plugins
run '~/.config/tmux/plugins/tpm/tpm'
