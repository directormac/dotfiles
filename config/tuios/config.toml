# TUIOS Configuration
# Documentation: https://tuios.dev/docs/configuration
# Keybindings:   https://tuios.dev/docs/keybindings
# Plugins:       https://tuios.dev/docs/plugins
# tmux Shim:     https://tuios.dev/docs/tmux-shim

[appearance]
theme = "catppuccin-mocha"
border_style = "rounded"
gap = 1
shared_borders = false
dim_unfocused = 15
motion = "full"
whichkey_enabled = true
whichkey_position = "bottom-right"

[appearance.sidebar]
background = "theme"

[keybindings]
leader_key = "ctrl+a"

[keybindings.window_management]
new_window = ["n", "ctrl+t"]
close_window = ["w", "x"]
rename_window = ["r"]
toggle_zoom = ["z"]
next_window = ["tab", "alt+n"]
prev_window = ["shift+tab", "alt+p"]
focus_sidebar = ["s"]

[keybindings.layout]
toggle_tiling = ["t"]
split_vertical = ["|", "\\"]
split_horizontal = ["-"]
equalize_splits = ["="]
rotate_split = ["R"]

# Vim-style directional focus and swap
snap_left = ["h"]
snap_right = ["l"]
focus_down = ["j"]
focus_up = ["k"]

swap_left = ["H", "ctrl+left"]
swap_right = ["L", "ctrl+right"]
swap_down = ["J", "ctrl+down"]
swap_up = ["K", "ctrl+up"]

[keybindings.terminal_mode]
terminal_exit_mode = ["alt+escape", "ctrl+escape"]
terminal_next_window = ["alt+n"]
terminal_prev_window = ["alt+p"]
terminal_focus_left = ["alt+left", "alt+h"]
terminal_focus_down = ["alt+down", "alt+j"]
terminal_focus_up = ["alt+up", "alt+k"]
terminal_focus_right = ["alt+right", "alt+l"]
terminal_paste_host = ["ctrl+shift+v", "super+v", "shift+super+v", "ctrl+middle"]

[workspaces]
new_window_when_empty = true

# Plugins
# TUIOS auto-discovers Herdr plugins from ~/.config/herdr/plugins.json
# and ~/.config/herdr/plugins/github/*. Enable any registered plugins here:
[plugins]
dirs = [
  "~/.config/herdr/plugins/github-installations",
  "~/.config/tuios/plugins",
]
enabled = [
  "herdr.collie",
]

# Agent & tmux shim permissions
# Grants admin & respond so teammates/tools under `tuios tmux-shim`
# (e.g. Claude Code agent teams, Collie) can open panes and interact seamlessly.
[agents]
enabled = true

[agents.permissions]
grants = ["admin", "respond"]
