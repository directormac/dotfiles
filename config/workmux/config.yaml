# ==============================================================================
# Workmux Global Configuration (~/.config/workmux/config.yaml)
# Managed in dotfiles: ~/.dotfiles/config/workmux/config.yaml
# Reference: https://workmux.raine.dev/guide/configuration/
# ==============================================================================
#
# COMMON COMMANDS CHEAT-SHEET:
# ------------------------------------------------------------------------------
# 1. Feature Work (Default: Session Mode):
#    $ workmux add <branch>           (Alias: wma <branch>)
#      -> Creates worktree & a dedicated tmux session with 4 windows:
#         [1:editor, 2:agent, 3:term, 4:git]
#
# 2. Quickfix Work (Window Mode from main):
#    $ workmux add <branch> --mode window --base main -l quickfix  (Alias: wmq <branch>)
#      -> Creates worktree as a single window inside current session
#      -> Branches cleanly from main branch
#      -> Opens focused Neovim without launching all 4 session windows
#
# 3. Using Named Layouts:
#    $ workmux add <branch> -l duo      -> Opens side-by-side Neovim + Agent
#    $ workmux add <branch> -l quickfix -> Single window Neovim
#    $ workmux add <branch> -l terminal -> Single clean shell
#
# 4. Navigation & Monitoring:
#    $ workmux list                   (Alias: wml) - List all worktrees & statuses
#    $ workmux dashboard              (Alias: wmd) - Interactive TUI dashboard
#    $ workmux sidebar                (Alias: wms) - Toggle live agent sidebar
#    In Tmux:
#      - Prefix + t                   -> Sesh session picker (fast switch between sessions)
#      - Prefix + w                   -> Workmux dashboard popup
#      - Prefix + W                   -> Toggle workmux sidebar
#
# 5. Finishing & Cleanup:
#    $ workmux merge                  (Alias: wmm) - Rebase & merge into main
#    $ workmux remove <branch>        (Alias: workmux rm) - Discard without merging
# ------------------------------------------------------------------------------

nerdfont: true
auto_update_check: false

# ------------------------------------------------------------------------------
# Git Configuration
# ------------------------------------------------------------------------------
# Automatically base new worktrees from main/master regardless of current branch
base_branch: auto

# Fast-forward rebase merge strategy
merge_strategy: rebase

# Keep worktree and branch after merge by default (cleanup manually or with --cleanup)
merge_keep: true

# ------------------------------------------------------------------------------
# Paths & Naming
# ------------------------------------------------------------------------------
# Centralized directory for worktrees, namespaced by repository name
worktree_dir: "~/Code/.worktrees/{project}"

# Prefix for tmux window and session names
window_prefix: "wm-{project}"

# ------------------------------------------------------------------------------
# Tmux & Session Mode (Default)
# ------------------------------------------------------------------------------
# Mode: "session" creates an isolated tmux session per worktree (with its own windows)
# Mode: "window" creates windows within the current session
mode: session

# Return to the primary 'main' session when a worktree session is closed/merged
default_session: main

# Auto-apply agent status icons in tmux window formats
status_format: true

status_icons:
  working: "🤖"
  waiting: "💬"
  done: "✅"

# ------------------------------------------------------------------------------
# Default Windows (Session Mode: 4 Windows per Worktree)
# Note: 'windows' is mutually exclusive with root-level 'panes'
# ------------------------------------------------------------------------------
windows:
  # Window 1: Editor
  - 
    panes:
      - command: nvim
        focus: true

  # Window 2: AI Coding Agent
  - 
    panes:
      - command: clear

  # Window 3: Git
  - 
    panes:
      - command: lazygit
      - command: workmux dashboard -t worktrees

  # Window 4: Agent
  - 
    panes:
      - command: <agent>

# ------------------------------------------------------------------------------
# Named Layouts (Selectable via `-l` / `--layout <name>`)
# ------------------------------------------------------------------------------
layouts:
  # Quickfix: Single editor window, ideal with `--mode window`
  quickfix:
    panes:
      - command: nvim
        focus: true

  # Duo: Split screen with Neovim on left (60%) and AI Agent on right (40%)
  duo:
    panes:
      - command: nvim
        focus: true
      - command: <agent>
        split: horizontal
        percentage: 40

  # Agent Only: Single pane running the configured AI agent
  agent-only:
    panes:
      - command: <agent>
        focus: true

  # Terminal Only: Single clean shell
  terminal:
    panes:
      - command: clear
        focus: true

# ------------------------------------------------------------------------------
# Agent & AI Integration
# ------------------------------------------------------------------------------
# Default agent used for '<agent>' placeholder
agent: "agy"

# Named agent profiles (used via <agent:name> or --agent <name>)
agents:
  agy: "agy"
  oc: "opencode"

# ------------------------------------------------------------------------------
# Sidebar Configuration
# ------------------------------------------------------------------------------
sidebar:
  position: left
  width: 40
  height: 3
  layout: tiles
  sort: recency
  group_by: project
  dim_stale: true
  collapse_stale: true
