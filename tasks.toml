# [task-configuration](https://mise.jdx.dev/tasks/task-configuration.html)
# [sed-cheatsheet](https://gist.github.com/ssstonebraker/6140154)

[setup]
description = "Will run the necessary commands that is related to the repo, in order to start development"
run = '''
  #!/usr/bin/env bash
  set -euo pipefail

  echo "Setting up repository. . . "

  echo "Installing dependencies. . . "

  # Elixir Packages

  mix deps.get

  # JS Packages

  pnpm install


  echo "Running setup and prepare commands..."
  
  mix workspace.run -t setup

  echo "Pulling docker images. . . "
  docker compose -f docker/compose.dev.yaml pull
  
  echo "Setup complete. . "

  '''


[ccc]
raw = true
run = '''
#!/usr/bin/env bash

export TEMP=$(mktemp -u)
trap 'rm -f "$TEMP"' EXIT

INITIAL_QUERY="${*:-}"
TRANSFORMER='
  rg_pat={q:1}      # The first word is passed to ripgrep
  fzf_pat={q:2..}   # The rest are passed to fzf

  if ! [[ -r "$TEMP" ]] || [[ $rg_pat != $(cat "$TEMP") ]]; then
    echo "$rg_pat" > "$TEMP"
    printf "reload:sleep 0.1; rg --column --line-number --no-heading --color=always --smart-case %q || true" "$rg_pat"
  fi
  echo "+search:$fzf_pat"
'
fzf --ansi --disabled --query "$INITIAL_QUERY" \
    --with-shell 'bash -c' \
    --bind "start,change:transform:$TRANSFORMER" \
    --color "hl:-1:underline,hl+:-1:underline:reverse" \
    --delimiter : \
    --preview 'bat --color=always {1} --highlight-line {2}' \
    --preview-window 'up,60%,border-line,+{2}+3/3,~3' \
    --bind 'enter:become(vim {1} +{2})'
'''
